name: 发布

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 构建并发布
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 读取版本
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version=$(sed -nE 's/^\s*Version\s*=\s*"([^"]+)"\s*$/\1/p' daemon/version/version.go)
          if [[ -z "$version" ]]; then
            echo "无法从 daemon/version/version.go 读取 Version" >&2
            exit 1
          fi
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version 格式不正确: $version" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "发布必须在 tag 上触发, 手动运行时请选择与 Version 一致的 tag" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" != "$version" ]]; then
            echo "Git tag (${GITHUB_REF_NAME}) 必须与 daemon/version/version.go 中的 Version ($version) 一致" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 构建发布包
        run: go run ./build.go

      - name: 生成校验和
        shell: bash
        run: |
          set -euo pipefail
          cd build
          sha256sum IpacPanel-*.zip > checksums.txt

      - name: 生成发布内容
        shell: bash
        run: |
          set -euo pipefail

          previous_tag=$(git describe --tags --abbrev=0 "${{ steps.version.outputs.version }}^" 2>/dev/null || true)

          sed 's/^          //' > release-notes.md <<'EOF'

          <details><summary>变更内容</summary>

          EOF

          if [[ -n "$previous_tag" ]]; then
            git log --pretty=format:'- %s (%h)' "$previous_tag..${{ steps.version.outputs.version }}" >> release-notes.md
          else
            git log --pretty=format:'- %s (%h)' "${{ steps.version.outputs.version }}" >> release-notes.md
          fi

          cat >> release-notes.md <<'EOF'

          </details>
          EOF

          if [[ ! -s release-notes.md ]]; then
            echo "生成发布内容失败" >&2
            exit 1
          fi

      - name: 创建或更新发布
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$VERSION" \
              --prerelease \
              --notes-file release-notes.md
          else
            gh release create "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$VERSION" \
              --notes-file release-notes.md \
              --prerelease \
              --verify-tag
          fi

          gh release upload "$VERSION" build/* --clobber --repo "$GITHUB_REPOSITORY"
